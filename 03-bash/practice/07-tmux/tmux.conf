# мышь и история
set -g mouse on
set -g history-limit 50000
# окна с 1
set -g base-index 1
# префикс Ctrl+A вместо Ctrl+B
unbind C-b
set -g prefix C-a
# разделение по | и -
bind | split-window -h
bind - split-window -v
# перечитать конфиг: префикс, затем r
bind r source-file ~/.tmux.conf \; display-message "config reloaded"
